name: Gerar APK do Caçador de Notificações

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Compilar
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cacador-de-Notificacoes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Caçador de Notificações (build ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
